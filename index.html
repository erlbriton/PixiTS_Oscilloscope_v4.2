<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Industrial Control Panel</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/monitor.css" />
  </head>
  <body>
    <div class="app-layout">
      <div id="osc-container" class="hidden"></div>

      <div class="panel-right">
        <div class="top-main-toolbar">
          <button class="tool-btn">🔧 ▾</button>
          <button class="tool-btn">🔍</button>
          <button class="tool-btn">📋</button>
          <div class="split-btn-group">
            <button id="toggleOscMainBtn" class="split-btn-main" title="Осциллограф">📈</button>
            <div class="split-btn-divider"></div>
            <button id="toggleOscArrowBtn" class="split-btn-arrow" title="Меню осциллографа">▾</button>
            <div id="toggleOscDropdown" class="split-dropdown-menu">
              <div class="split-dropdown-item" id="menuToggleOsc">Осциллограф</div>
              <div class="split-dropdown-item" id="menuViewRec">Просмотр осциллограммы</div>
            </div>
          </div>
          <button class="tool-btn">💾</button>
          <button class="tool-btn">📦 ▾</button>

          <input type="file" id="filePicker" multiple accept=".ini,.txt" style="display: none" />
          <input type="file" id="folderPicker" webkitdirectory directory style="display: none" />

          <div class="split-btn-group">
            <button id="folderActionBtn" class="split-btn-main" title="Открыть файл">📁</button>
            <div class="split-btn-divider"></div>
            <button id="folderArrowBtn" class="split-btn-arrow">▼</button>
            <div id="folderDropdown" class="split-dropdown-menu">
              <div class="split-dropdown-item" id="menuOpenFile">Открыть файл</div>
              <div class="split-dropdown-item" id="menuOpenFolder">Открыть папку</div>
            </div>
          </div>

          <select class="toolbar-device-mode-select">
            <option value="FLASH">FLASH</option>
            <option value="CD">CD</option>
            <option value="RAM">RAM</option>
          </select>

          <button id="connectBtn" class="action-btn">подключиться</button>
          <button id="idBtn" class="action-btn">ID</button>
        </div>

        <div class="panel-content-wrapper">
          <div class="left-sidebar-column">
            <div class="sidebar-tree-container"></div>
          </div>
          <div class="sidebar-resizer"></div>
          <div class="right-main-content">
            <div class="settings-panel">
              <div class="settings-section-title">Настройки связи</div>
              <div class="settings-row">
                <span class="label">BUS</span>
                <select class="select-blue"><option>MODBUS RTU</option></select>
                <span class="label">COM</span>
                <select id="comSelect" class="select-gray"><option>—</option></select>
                <span class="label">BPS</span>
                <select id="baudSelect" class="select-blue">
                    <option value="9600">9600</option>
                    <option value="19200">19200</option>
                    <option value="57600">57600</option>
                    <option value="115200" selected>115200</option>
                    <option value="230400">230400</option>
                    <option value="460800">460800</option>
                    <option value="921600">921600</option>
                </select>
                <span class="label">FrameEnd</span>
                <input type="text" class="input-text frame-input" value="20" />
                <span class="label">Адрес</span>
                <input type="text" class="input-text address-input" value="x01" />
              </div>
              <div class="id-banner">ID: <span>—</span></div>
              <div class="settings-row">
                <span class="label">Тип механизма</span>
                <input type="text" class="input-text mechanism-input" value="Не указан" />
                <span class="label">Дата</span>
                <input type="text" class="input-text date-input" value="29.01.1964" />
                <button class="inline-btn">Сегодня</button>
              </div>
              <div class="settings-divider"></div>
              <div class="settings-row last-row">
                <span class="label">Место установки</span>
                <input type="text" class="input-text location-input" value="" />
                <button id="save-btn" class="inline-btn">Сохранить изменения</button>
                <button id="refresh-btn" class="refresh-btn">🔄 Обновить</button>
              </div>
            </div>
            <div class="table-wrapper">
              <table class="modbus-grid">
                <colgroup>
                  <col style="width: 6%" /><col style="width: 12%" /><col style="width: 28%" /><col style="width: 8%" />
                  <col style="width: 10%" /><col style="width: 13%" /><col style="width: 10%" /><col style="width: 13%" />
                </colgroup>
                <thead>
                  <tr>
                    <th colspan="4" class="main-group">ПАРАМЕТРЫ</th>
                    <th colspan="2" class="main-group">БАЗА</th>
                    <th colspan="2" class="main-group">КОНТРОЛЛЕР</th>
                  </tr>
                  <tr>
                    <th>№</th><th>Имя</th><th>Описание</th><th>Ед.изм</th><th>hex</th><th>Physical</th><th>hex</th><th>Physical</th>
                  </tr>
                </thead>
                <tbody id="grid-data-rows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
